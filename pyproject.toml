[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmocompare"
dynamic = ["version"]
authors = [
    { name = "Dily Duan Yi Ong", email = "dlo26@cam.ac.uk" },
]
description = "Bayesian model comparison by importance sampling of existing nested-sampling chains"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "anesthetic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
"Homepage" = "https://github.com/DilyOng/cosmocompare"
"Bug Tracker" = "https://github.com/DilyOng/cosmocompare/issues"

[project.optional-dependencies]
# Re-evaluating a target likelihood needs Cobaya; inspecting results, running
# the prior maths and the evidence estimator does not. The heavy dependency is
# therefore optional so the package stays cheap to install and to test.
likelihood = ["cobaya"]
parallel = ["joblib", "tqdm"]
docs = ["sphinx", "sphinx_rtd_theme", "numpydoc"]
test = ["pytest", "pytest-cov", "flake8", "pydocstyle", "packaging", "black", "isort"]

[tool.setuptools.packages.find]
include = ["cosmocompare*"]

[tool.setuptools.dynamic]
version = { attr = "cosmocompare._version.__version__" }

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "likelihood: requires the optional Cobaya likelihood stack",
]
