name: Code style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

# Every job below names `cosmocompare` explicitly. Pointing a linter at a
# directory that does not exist makes it match no files and exit 0, so the job
# stays green while reporting nothing.
jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install black==24.8.0
      - run: black --check cosmocompare tests

  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install isort==5.13.2
      - run: isort --check-only cosmocompare tests

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install flake8==7.1.1
      # Settings live in .flake8 so the command documented in CONTRIBUTING
      # works unmodified.
      - run: flake8 cosmocompare tests

  pydocstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pydocstyle==6.3.0
      - run: pydocstyle --convention=numpy cosmocompare
